<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef1ed">
  <meta name="description" content="Company Overview of Noboa Trading Co TCN S.A., home of the Bonita Bananas brand in Ecuador.">
  <title>Noboa Trading — Company Overview</title>
  <style>
    :root{color-scheme:light;--background:#eef1ed;--frame:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--background)}
    body{font-family:Arial,Helvetica,sans-serif}
    main{min-height:100vh;display:grid;place-items:start center;padding:clamp(10px,3vw,36px)}
    figure{width:min(100%,1024px);margin:0;background:var(--frame);box-shadow:0 12px 45px rgba(0,41,27,.2)}
    img{display:block;width:100%;height:auto}
    @media(max-width:640px){main{padding:0}figure{box-shadow:none}}
  </style>
</head>
<body>
  <main>
    <figure>
      <img src="poster-noboa.png" alt="Noboa Trading Co TCN S.A. company overview and Bonita product portfolio">
    </figure>
  </main>
</body>
</html>
