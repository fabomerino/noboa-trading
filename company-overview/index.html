<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noboa Trading - Company Overview</title>
    <meta
      name="description"
      content="Company Overview de Noboa Trading disponible para lectura en navegador."
    />
    <style>
      :root {
        --navy: #06235b;
        --yellow: #f7dd39;
        --ink: #172033;
        --muted: #687389;
        --line: #d9deea;
        --paper: #ffffff;
        --bg: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        background: var(--navy);
        color: white;
        border-bottom: 12px solid var(--yellow);
      }

      .bar {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 108px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .brand-logo {
        display: block;
        width: min(390px, 44vw);
        height: auto;
        max-height: 78px;
        object-fit: contain;
        background: white;
        border-radius: 6px;
      }

      .brand-text {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 4vw, 48px);
        line-height: 1;
        letter-spacing: 0;
        font-weight: 800;
      }

      .subtitle {
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 16px;
      }

      .partner-logo {
        display: block;
        width: 150px;
        height: auto;
        max-height: 74px;
        object-fit: contain;
        padding: 8px 10px;
        background: white;
        border-radius: 6px;
      }

      .actions {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .open-link {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 6px;
        background: var(--yellow);
        color: var(--navy);
        font-weight: 700;
        text-decoration: none;
      }

      main {
        flex: 1;
        width: min(1180px, calc(100% - 32px));
        margin: 24px auto;
      }

      .viewer {
        height: calc(100vh - 164px);
        min-height: 620px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--paper);
        box-shadow: 0 18px 42px rgba(6, 35, 91, 0.12);
      }

      iframe,
      object {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }

      .fallback {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
      }

      .fallback p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 18px;
      }

      @media (max-width: 720px) {
        .bar {
          min-height: 0;
          align-items: flex-start;
          justify-content: center;
          flex-direction: column;
          padding: 20px 0;
        }

        .brand {
          width: 100%;
          align-items: flex-start;
          flex-direction: column;
        }

        .brand-logo {
          width: min(100%, 390px);
          max-height: none;
        }

        .actions {
          width: 100%;
          align-items: stretch;
          flex-direction: column;
        }

        .partner-logo {
          width: 170px;
          max-height: none;
        }

        .open-link {
          width: 100%;
        }

        main {
          width: 100%;
          margin: 0;
        }

        .viewer {
          min-height: 0;
          height: calc(100vh - 228px);
          border-left: 0;
          border-right: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="brand">
          <img
            class="brand-logo"
            src="noboa-trading-logo.jpg"
            alt="Noboa Trading Co TCN S.A."
          />
          <div class="brand-text">
            <h1>NOBOA TRADING</h1>
            <p class="subtitle">Company Overview</p>
          </div>
        </div>
        <div class="actions">
          <img class="partner-logo" src="bonita-logo.jpg" alt="Bonita Premium Bananas" />
          <a class="open-link" href="company-overview.pdf" target="_blank" rel="noopener">
            Abrir PDF
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="viewer" aria-label="Visor de PDF">
        <object data="company-overview.pdf" type="application/pdf">
          <iframe src="company-overview.pdf" title="Company Overview"></iframe>
          <div class="fallback">
            <div>
              <p>El navegador no pudo mostrar el PDF dentro de la pagina.</p>
              <a class="open-link" href="company-overview.pdf">Abrir PDF</a>
            </div>
          </div>
        </object>
      </section>
    </main>
  </body>
</html>
